name: API CI/CD Pipeline

# FIX: Draait nu op push én pull requests voor 'main' en 'dev' branches
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
        
    - name: Install dependencies
      # FIX: Exacte map gebruiken zodat requirements.txt gegarandeerd gevonden wordt
      working-directory: ./code/api
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      working-directory: ./code
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    needs: build
    runs-on: ubuntu-latest
    environment: development
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
        
    - name: Install dependencies
      # FIX: Exacte map gebruiken voor requirements
      working-directory: ./code/api
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Start API Server
      # FIX: Start precies in de map waar main.py leeft
      working-directory: ./code/api
      run: |
        python main.py &
        sleep 3
        
    - name: Test with pytest & run coverage
      working-directory: ./code
      run: |
        # FIX: --rcfile=.coveragerc dwingt af dat de instellingen 100% zeker geladen worden
        # FIX: Pad test/integration/ is afgestemd op de huidige repository
        coverage run --rcfile=api/.coveragerc -m pytest test/integration/
        coverage xml
        
    - name: Run code coverage report
      working-directory: ./code
      run: |
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
        coverage report --fail-under=70
        
    - name: Store coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: code/coverage.xml
      if: ${{ failure() }}