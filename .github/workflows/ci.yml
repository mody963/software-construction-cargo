name: API CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: code/requirements.txt

    - name: Install dependencies
      working-directory: ./code
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      working-directory: ./code
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    needs: build
    runs-on: ubuntu-latest
    environment: development

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: code/requirements.txt

    - name: Install dependencies
      working-directory: ./code
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start API Server
      working-directory: ./code/api
      run: |
        python main.py &
        sleep 3

    - name: Test with pytest & run coverage
      working-directory: ./code
      run: |
        coverage run --rcfile=api/.coveragerc -m pytest test/integration/
        coverage xml

    - name: Run code coverage report
      working-directory: ./code
      run: |
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
        coverage report --fail-under=70

    - name: Store coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: code/coverage.xml
      if: ${{ failure() }}